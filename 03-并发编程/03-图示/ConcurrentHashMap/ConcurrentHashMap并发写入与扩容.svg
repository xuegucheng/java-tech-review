<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ConcurrentHashMap 并发写入与协作扩容</title>
  <desc id="desc">展示 ConcurrentHashMap 的空 bin CAS、非空 bin 锁、无锁读取、TreeBin 以及 ForwardingNode 协作扩容路径。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font:700 40px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .subtitle { font:400 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#475569; }
      .section { font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .label { font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .body { font:400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#334155; }
      .small { font:400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#475569; }
      .node { rx:12; stroke-width:2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="70" class="title">ConcurrentHashMap：局部并发，而不是整张表加锁</text>
  <text x="70" y="108" class="subtitle">Java 8+ / Java 21 主线：Node 数组、CAS、bin 级 synchronized、TreeBin、ForwardingNode。</text>

  <rect x="70" y="155" width="720" height="315" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="202" class="section">put：冲突范围尽量缩小到一个 bin</text>
  <rect x="105" y="235" width="175" height="65" class="node" fill="#ffffff" stroke="#93c5fd"/>
  <text x="192" y="275" text-anchor="middle" class="label">put(k, v)</text>
  <rect x="330" y="235" width="175" height="65" class="node" fill="#ffffff" stroke="#93c5fd"/>
  <text x="417" y="275" text-anchor="middle" class="label">定位 tab[i]</text>
  <line x1="285" y1="267" x2="320" y2="267" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="555" y="220" width="205" height="88" class="node" fill="#dcfce7" stroke="#4ade80"/>
  <text x="657" y="257" text-anchor="middle" class="label">空 bin</text>
  <text x="657" y="286" text-anchor="middle" class="body">CAS 放入首节点</text>
  <line x1="510" y1="267" x2="545" y2="267" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="330" y="350" width="175" height="65" class="node" fill="#ffffff" stroke="#93c5fd"/>
  <text x="417" y="390" text-anchor="middle" class="label">非空 bin</text>
  <rect x="555" y="335" width="205" height="95" class="node" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="657" y="373" text-anchor="middle" class="label">bin 头节点锁</text>
  <text x="657" y="402" text-anchor="middle" class="body">更新链表 / TreeBin</text>
  <line x1="417" y1="305" x2="417" y2="340" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="510" y1="382" x2="545" y2="382" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="105" y="450" class="small">空桶走无锁快速路径；热点冲突只让同一 bin 的写入互斥，不阻塞所有 bin。</text>

  <rect x="830" y="155" width="700" height="315" rx="18" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
  <text x="865" y="202" class="section">get：通常只读，不需要显式锁</text>
  <rect x="865" y="235" width="190" height="65" class="node" fill="#ffffff" stroke="#86efac"/>
  <text x="960" y="275" text-anchor="middle" class="label">volatile table</text>
  <rect x="1100" y="235" width="170" height="65" class="node" fill="#ffffff" stroke="#86efac"/>
  <text x="1185" y="275" text-anchor="middle" class="label">bin 头节点</text>
  <rect x="1315" y="235" width="180" height="65" class="node" fill="#ffffff" stroke="#86efac"/>
  <text x="1405" y="275" text-anchor="middle" class="label">value / next</text>
  <line x1="1060" y1="267" x2="1090" y2="267" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1275" y1="267" x2="1305" y2="267" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="865" y="355" class="body">• Node 的 key、value、next 访问路径按并发语义组织。</text>
  <text x="865" y="390" class="body">• 读到 ForwardingNode 时，转向 nextTable 继续查找。</text>
  <text x="865" y="425" class="body">• “get 无锁”不等于跨多个 key 的快照或事务一致性。</text>

  <rect x="70" y="520" width="1460" height="300" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="105" y="568" class="section">resize：ForwardingNode 把扩容变成可协作的迁移</text>
  <rect x="105" y="625" width="220" height="85" class="node" fill="#ffffff" stroke="#fdba74"/>
  <text x="215" y="660" text-anchor="middle" class="label">旧 table</text>
  <text x="215" y="690" text-anchor="middle" class="body">待迁移 bin 区间</text>
  <rect x="430" y="625" width="240" height="85" class="node" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="550" y="660" text-anchor="middle" class="label">transferIndex</text>
  <text x="550" y="690" text-anchor="middle" class="body">分配迁移区间</text>
  <rect x="775" y="625" width="250" height="85" class="node" fill="#fee2e2" stroke="#f87171"/>
  <text x="900" y="660" text-anchor="middle" class="label">ForwardingNode</text>
  <text x="900" y="690" text-anchor="middle" class="body">该 bin 已转移</text>
  <rect x="1130" y="625" width="300" height="85" class="node" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1280" y="660" text-anchor="middle" class="label">nextTable</text>
  <text x="1280" y="690" text-anchor="middle" class="body">新表中的新位置</text>
  <line x1="335" y1="667" x2="420" y2="667" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="680" y1="667" x2="765" y2="667" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="1035" y1="667" x2="1120" y2="667" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M550 725 C550 780 890 780 890 720" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
  <text x="720" y="785" text-anchor="middle" class="small">其他线程遇到 ForwardingNode，可 helpTransfer；读写协作完成迁移</text>
  <text x="1130" y="745" class="small">边界：不允许 null；</text>
  <text x="1130" y="772" class="small">computeIfAbsent 等原子 API 也不提供多 key 事务。</text>
</svg>
