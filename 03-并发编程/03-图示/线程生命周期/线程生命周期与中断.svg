<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Java 线程生命周期与中断协作</title>
  <desc id="desc">展示 Thread.State 六种状态的典型转换，以及 interrupt 对 sleep、wait、join 和 park 的不同影响。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 40px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .subtitle { font: 400 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#475569; }
      .section { font: 700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .label { font: 700 22px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .body { font: 400 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#334155; }
      .small { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#475569; }
      .state { stroke-width:2; rx:16; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="70" class="title">线程生命周期与中断协作</text>
  <text x="70" y="108" class="subtitle">Thread.State 描述 Java 层观察到的状态；interrupt 是协作式请求，不是强制杀线程。</text>

  <text x="70" y="165" class="section">六种状态：先看线程在等待什么</text>

  <rect x="80" y="205" width="210" height="100" class="state" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="185" y="245" text-anchor="middle" class="label">NEW</text>
  <text x="185" y="275" text-anchor="middle" class="small">已创建，尚未 start</text>

  <rect x="390" y="205" width="250" height="100" class="state" fill="#dcfce7" stroke="#16a34a"/>
  <text x="515" y="245" text-anchor="middle" class="label">RUNNABLE</text>
  <text x="515" y="275" text-anchor="middle" class="small">可运行 / 正运行</text>

  <rect x="1260" y="205" width="250" height="100" class="state" fill="#e2e8f0" stroke="#64748b"/>
  <text x="1385" y="245" text-anchor="middle" class="label">TERMINATED</text>
  <text x="1385" y="275" text-anchor="middle" class="small">run 返回或异常结束</text>

  <line x1="300" y1="255" x2="380" y2="255" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="235" text-anchor="middle" class="small">start()</text>
  <line x1="650" y1="255" x2="1250" y2="255" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="950" y="235" text-anchor="middle" class="small">run 返回 / 异常结束</text>

  <rect x="120" y="355" width="270" height="85" class="state" fill="#fef3c7" stroke="#d97706"/>
  <text x="255" y="390" text-anchor="middle" class="label">BLOCKED</text>
  <text x="255" y="418" text-anchor="middle" class="small">等待进入 synchronized monitor</text>
  <rect x="450" y="355" width="270" height="85" class="state" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="585" y="390" text-anchor="middle" class="label">WAITING</text>
  <text x="585" y="418" text-anchor="middle" class="small">wait / join / park</text>
  <rect x="780" y="355" width="320" height="85" class="state" fill="#fce7f3" stroke="#db2777"/>
  <text x="940" y="390" text-anchor="middle" class="label">TIMED_WAITING</text>
  <text x="940" y="418" text-anchor="middle" class="small">sleep / timeout / parkNanos</text>

  <path d="M480 310 C480 330 260 330 260 345" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-muted)"/>
  <path d="M515 310 L585 345" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-muted)"/>
  <path d="M550 310 C550 330 940 330 940 345" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-muted)"/>
  <path d="M255 355 C255 330 390 330 430 310" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-muted)"/>
  <path d="M585 355 C585 335 555 325 545 310" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-muted)"/>
  <path d="M940 355 C940 330 680 330 625 310" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-muted)"/>
  <text x="690" y="468" text-anchor="middle" class="small">释放 monitor、被通知、被 unpark、条件满足或超时后，再回到 RUNNABLE 竞争</text>

  <rect x="70" y="480" width="700" height="320" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="100" y="525" class="section">interrupt：发出请求，不替你决定策略</text>
  <text x="105" y="570" class="body">• 普通运行线程：设置中断标志，业务代码需要主动检查。</text>
  <text x="105" y="610" class="body">• sleep / wait / join：通常抛 InterruptedException，</text>
  <text x="125" y="640" class="body">  并清除中断标志；捕获后应退出、恢复或继续协作。</text>
  <text x="105" y="680" class="body">• park：被中断后返回，但中断标志通常仍保持。</text>
  <text x="105" y="720" class="body">• 阻塞在 synchronized 入口：不会因为 interrupt 直接抛异常。</text>
  <text x="105" y="760" class="small">结论：取消协议必须由任务、阻塞 API 和 finally 清理共同完成。</text>

  <rect x="810" y="480" width="735" height="320" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="840" y="525" class="section">最容易混淆的等待边界</text>
  <text x="845" y="575" class="label">BLOCKED</text>
  <text x="1010" y="575" class="body">只是在 synchronized monitor 入口排队，不代表调用了 wait。</text>
  <text x="845" y="625" class="label">WAITING</text>
  <text x="1010" y="625" class="body">线程已主动交出执行机会，等待通知、线程结束或许可。</text>
  <text x="845" y="675" class="label">sleep</text>
  <text x="1010" y="675" class="body">进入 TIMED_WAITING，但不释放已经持有的 monitor。</text>
  <text x="845" y="725" class="label">wait</text>
  <text x="1010" y="725" class="body">释放当前 monitor，返回前必须重新获得它。</text>
  <text x="845" y="775" class="small">RUNNABLE 不等于“正在占用 CPU”：Java API 不区分 ready 与 running。</text>
</svg>
