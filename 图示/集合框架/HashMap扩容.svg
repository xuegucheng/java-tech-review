<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">HashMap resize 的低位高位拆分</title>
  <desc id="desc">容量从 4 扩大到 8 后，原桶中的节点根据 oldCap 位保持在低位或移动到高位。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">HashMap resize：扩容一倍，节点按一位拆分</text>
  <text x="640" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">容量是 2 的幂时，新索引只需要观察 oldCap 这一位</text>

  <g font-family="sans-serif">
    <text x="140" y="125" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">扩容前：capacity = 4</text>
    <rect x="40" y="150" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="185" text-anchor="middle" font-size="17" fill="#1e3a8a">table[0]</text>
    <rect x="40" y="220" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="255" text-anchor="middle" font-size="17" fill="#1e3a8a">table[1]：A → B</text>
    <rect x="40" y="290" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="325" text-anchor="middle" font-size="17" fill="#1e3a8a">table[2]</text>
    <rect x="40" y="360" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="395" text-anchor="middle" font-size="17" fill="#1e3a8a">table[3]</text>

    <text x="390" y="156" font-size="18" font-weight="700" fill="#334155">原桶 table[1]</text>
    <rect x="330" y="180" width="230" height="74" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="445" y="210" text-anchor="middle" font-size="18" fill="#78350f">A：hash 的 oldCap 位 = 0</text>
    <text x="445" y="237" text-anchor="middle" font-size="16" fill="#92400e">保持低位</text>
    <rect x="330" y="285" width="230" height="74" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="445" y="315" text-anchor="middle" font-size="18" fill="#7f1d1d">B：hash 的 oldCap 位 = 1</text>
    <text x="445" y="342" text-anchor="middle" font-size="16" fill="#991b1b">移动 oldCap</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M240 249 C275 249, 285 217, 325 217"/>
    <path d="M240 249 C275 249, 285 322, 325 322"/>
  </g>

  <g font-family="sans-serif">
    <text x="930" y="125" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">扩容后：capacity = 8</text>
    <rect x="690" y="150" width="200" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="790" y="185" text-anchor="middle" font-size="17" fill="#14532d">table[1]：A</text>
    <rect x="690" y="220" width="200" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="790" y="255" text-anchor="middle" font-size="17" fill="#14532d">table[5]：B</text>
    <rect x="940" y="150" width="200" height="58" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1040" y="185" text-anchor="middle" font-size="17" fill="#334155">table[0], [2], [3]</text>
    <rect x="940" y="220" width="200" height="58" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1040" y="255" text-anchor="middle" font-size="17" fill="#334155">table[4], [6], [7]</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M560 217 C610 217, 630 180, 685 180"/>
    <path d="M560 322 C620 322, 630 250, 685 250"/>
  </g>
  <rect x="120" y="470" width="1040" height="52" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="640" y="503" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#312e81">新索引 = oldIndex 或 oldIndex + oldCap；不需要重新计算完整 hash</text>
</svg>
