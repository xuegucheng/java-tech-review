<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">final reference versus immutable object</title>
  <desc id="desc">A final reference cannot be rebound but the mutable object it points to can change. An immutable snapshot exposes no state-changing operation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .label { font: 600 19px sans-serif; fill: #0f172a; }
      .small { font: 16px sans-serif; fill: #334155; }
      .box { stroke: #334155; stroke-width: 2; rx: 18; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .blocked { stroke: #b91c1c; stroke-width: 4; fill: none; stroke-dasharray: 9 8; }
    </style>
  </defs>
  <rect width="1400" height="720" fill="#f8fafc"/>
  <text x="70" y="65" class="title">final 引用不等于对象不可变</text>
  <text x="70" y="98" class="small">要区分“引用槽不能换”和“对象状态没有公开修改入口”</text>

  <rect x="70" y="170" width="560" height="420" class="box" fill="#fff7ed"/>
  <text x="350" y="220" text-anchor="middle" class="label">final List 引用</text>
  <rect x="135" y="285" width="200" height="85" class="box" fill="#ffedd5"/>
  <text x="235" y="337" text-anchor="middle" class="label">final list</text>
  <rect x="440" y="250" width="190" height="155" class="box" fill="#fed7aa"/>
  <text x="535" y="295" text-anchor="middle" class="label">可变对象</text>
  <text x="535" y="330" text-anchor="middle" class="small">[A, B]</text>
  <text x="535" y="365" text-anchor="middle" class="small">add(C) 合法</text>
  <path d="M335 328 L440 328" class="arrow"/>
  <path d="M235 390 C235 500 535 520 535 405" class="arrow"/>
  <text x="255" y="510" class="small">对象状态仍可改变</text>
  <path d="M235 285 L235 235" class="blocked"/>
  <text x="250" y="245" class="small">不能改为指向新对象</text>

  <rect x="770" y="170" width="560" height="420" class="box" fill="#f0fdf4"/>
  <text x="1050" y="220" text-anchor="middle" class="label">不可变快照</text>
  <rect x="835" y="285" width="200" height="85" class="box" fill="#dcfce7"/>
  <text x="935" y="337" text-anchor="middle" class="label">snapshot</text>
  <rect x="1140" y="250" width="125" height="155" class="box" fill="#bbf7d0"/>
  <text x="1202" y="295" text-anchor="middle" class="label">[A, B]</text>
  <text x="1202" y="335" text-anchor="middle" class="small">无 add</text>
  <text x="1202" y="365" text-anchor="middle" class="small">无 set</text>
  <path d="M1035 328 L1140 328" class="arrow"/>
  <path d="M1202 405 L1202 480" class="blocked"/>
  <text x="1040" y="520" class="small">List.copyOf 建立不可修改快照</text>
  <text x="1040" y="550" class="small">但元素本身仍可能是可变对象</text>
</svg>
